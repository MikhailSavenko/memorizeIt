<style>
  .duplicate-item {
    background-color: #ffffff !important;
    position: relative;
    border-color: #cbd5e1;
  }
  .duplicate-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);
    z-index: 10; /* МАГИЯ: вытаскиваем карточку на самый верхний слой! */
  }
</style>
<ul class="list-group shadow">
  {% if words %}
  <li class="list-group-item d-flex justify-content-between align-items-center text-muted" style="font-size: 0.95rem; line-height: 1.4; background-color: #fafafa;">
      <div class="flex-grow-1 pt-1">This word already exists. To add a new translation to the existing part of speech, click below to update:</div>
    <button class="btn-close" style="font-size: 0.80rem; padding: 0; margin-top: 0px;" aria-label="Close" hx-on:click="this.closest('ul').remove()"></button>
  </li>
  {% endif %}
  {% for word in words %}
    <a href="{% url 'word:word_update' word.slug %}" class="text-decoration-none d-block">
      <li class="list-group-item d-flex justify-content-between align-items-center duplicate-item rounded-3 overflow-hidden">
        <div class="d-flex align-items-center gap-2">
          <!-- 1. Жирное слово -->
          <strong class="text-dark" style="font-weight: 700; font-size: 1rem;">{{ word.word }}</strong>

          <!-- 2. Твой зеленый бейдж (он сам сделает отступ за счет gap-2) -->
          <span style="background-color: #e8f5e9; color: #198754; padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.8rem;">
            {{ word.part_of_speech }}
          </span>

          <!-- 3. Чистый перевод БЕЗ тире перед ним -->
          <span class="text-secondary" style="font-size: 0.95rem; color: #6c757d;">
            {{ word.translations_string }}
          </span>
        </div>
      </li>
    </a>
  {% endfor %}
</ul>
